# console — Next.js governance UI. All config is baked at build time (NEXT_PUBLIC_*),
# so there is no runtime environment to inject here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: {{- include "tp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: console }
  template:
    metadata:
      labels: { app: console }
    spec:
      containers:
        - name: console
          image: {{ .Values.images.console }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports: [{ containerPort: 8090 }]
          livenessProbe:
            tcpSocket: { port: 8090 }
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket: { port: 8090 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: console
  labels: {{- include "tp.labels" . | nindent 4 }}
spec:
  selector: { app: console }
  ports: [{ port: 8090, targetPort: 8090 }]
