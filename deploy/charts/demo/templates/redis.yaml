# In-cluster Redis for the demo: TC store (db 2), event streams (db 1), bridge records (db 4).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "tp.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 10
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels: {{- include "tp.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "tp.labels" . | nindent 4 }}
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
