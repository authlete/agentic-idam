# fed-bridge — consumes lifecycle events (Redis Streams) and registers clients into the
# downstream Authlete via DCR. Single replica so it's a single Streams consumer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fed-bridge
  labels: {{- include "tp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: fed-bridge }
  template:
    metadata:
      labels: { app: fed-bridge }
    spec:
      containers:
        - name: fed-bridge
          image: {{ .Values.images.fedBridge }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - { name: PORT, value: "8093" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: REDIS_DB_STREAMS, value: "1" }
            - { name: REDIS_DB_STORE, value: "4" }
            # The TC is the Trust Anchor: one URL for identity reads and /resolve (public, so the
            # pinned entity_id matches the engine-signed iss). TRUST_ANCHOR_URL defaults to this.
            - { name: TC_BASE_URL, value: "https://{{ include "tp.host" (list . "tc") }}" }
            - { name: DCR_REGISTRATION_ENDPOINT, value: {{ .Values.dcr.registrationEndpoint | quote }} }
            - { name: DCR_TOKEN_AUTH_METHOD, value: {{ .Values.dcr.tokenAuthMethod | quote }} }
            - name: DCR_INITIAL_ACCESS_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.dcr }}, key: DCR_INITIAL_ACCESS_TOKEN } }
            {{- if .Values.fedBridge.trustAnchorJwks }}
            # Pinned anchor keys for chain verification (fails closed if unset).
            - name: TRUST_ANCHOR_JWKS
              valueFrom: { configMapKeyRef: { name: fed-bridge-jwks, key: TRUST_ANCHOR_JWKS } }
            {{- end }}
          ports: [{ containerPort: 8093 }]
          livenessProbe:
            tcpSocket: { port: 8093 }
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket: { port: 8093 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fed-bridge
  labels: {{- include "tp.labels" . | nindent 4 }}
spec:
  selector: { app: fed-bridge }
  ports: [{ port: 8093, targetPort: 8093 }]
{{- if .Values.fedBridge.trustAnchorJwks }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fed-bridge-jwks
  labels: {{- include "tp.labels" . | nindent 4 }}
data:
  # Anchor public JWKS.
  TRUST_ANCHOR_JWKS: {{ .Values.fedBridge.trustAnchorJwks | quote }}
{{- end }}
