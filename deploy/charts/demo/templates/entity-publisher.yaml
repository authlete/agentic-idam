# entity-publisher (RP Host) — serves agent leaf entity configs. Holds per-agent keys
# in memory, so a single replica keeps published leaves consistent across requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: entity-publisher
  labels: {{- include "tp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: entity-publisher }
  template:
    metadata:
      labels: { app: entity-publisher }
    spec:
      containers:
        - name: entity-publisher
          image: {{ .Values.images.entityPublisher }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - { name: PORT, value: "8092" }
            - { name: PUBLIC_BASE_URL, value: "https://{{ include "tp.host" (list . "rp") }}" }
          ports: [{ containerPort: 8092 }]
          livenessProbe:
            tcpSocket: { port: 8092 }
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket: { port: 8092 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: entity-publisher
  labels: {{- include "tp.labels" . | nindent 4 }}
spec:
  selector: { app: entity-publisher }
  ports: [{ port: 8092, targetPort: 8092 }]
