# Demo infra. Our own Redis for the app store + event bus
#   appendonly yes      -> SoR survives a crash mid-demo
#   maxmemory-policy noeviction -> Agent Identity records never evicted under memory pressure
#
# The demo components call the Vouch API (hosted); set VOUCH_BASE_URL per service.

services:
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
